[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scre"
version = "0.1.0"
description = "Sentence-level Context Reduction Engine (SCRE) for RAG pipelines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Aparajith Guha" }
]
dependencies = []   # prompt mode (PromptReducer / reduce_prompt) needs only the standard library

[project.optional-dependencies]
document = [
    "spacy>=3.0.0"          # document mode (SCRE.reduce); without it that mode falls back to regex-only
]
ml = [
    "sentence-transformers",
    "torch",
    "tiktoken"
]
llm = [
    "ollama"
]
eval = [
    "rank_bm25"
]
showcase = [
    "flask"
]
all = [
    "spacy>=3.0.0",
    "flask",
    "sentence-transformers",
    "torch",
    "tiktoken",
    "ollama",
    "rank_bm25"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scre"]